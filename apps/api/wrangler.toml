name = "alarm-clock-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# The API has no auth, no cookies, no sensitive data — it's safe to allow all
# origins. Cloudflare Pages assigns a fresh hash URL to every deploy, so
# hardcoding any single URL breaks on the next deploy.
ALLOWED_ORIGIN = "*"

# Optional — set in Cloudflare dashboard for production:
# NEWSAPI_KEY = "your_key_here"
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1e25"/>
      <stop offset="1" stop-color="#1d333d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89a76"/>
      <stop offset="1" stop-color="#946b4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#b58863" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#b58863" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle warm glow behind clock -->
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Outer ring (clock bezel) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.5"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="158" fill="#162a32"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.7"/>

  <!-- Hour ticks (12, 3, 6, 9) -->
  <line x1="256" y1="118" x2="256" y2="138" stroke="#b58863" stroke-width="4" stroke-linecap="round"/>
  <line x1="394" y1="256" x2="374" y2="256" stroke="#b58863" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="394" x2="256" y2="374" stroke="#b58863" stroke-width="4" stroke-linecap="round"/>
  <line x1="118" y1="256" x2="138" y2="256" stroke="#b58863" stroke-width="4" stroke-linecap="round"/>

  <!-- Hour hand pointing to 10 (subtle "wake up" feel) -->
  <line x1="256" y1="256" x2="186" y2="200" stroke="#d3c3b9" stroke-width="10" stroke-linecap="round"/>
  <!-- Minute hand pointing to 2 -->
  <line x1="256" y1="256" x2="338" y2="200" stroke="#d3c3b9" stroke-width="7" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="9" fill="#b58863"/>
  <circle cx="256" cy="256" r="4" fill="#0e1e25"/>

  <!-- Alarm bells (top) -->
  <path d="M 180 86 Q 180 70 196 70 L 220 70 Q 236 70 236 86 L 236 110 L 180 110 Z" fill="url(#ring)"/>
  <path d="M 276 86 Q 276 70 292 70 L 316 70 Q 332 70 332 86 L 332 110 L 276 110 Z" fill="url(#ring)"/>

  <!-- Bell clappers -->
  <circle cx="208" cy="118" r="10" fill="url(#ring)"/>
  <circle cx="304" cy="118" r="10" fill="url(#ring)"/>

  <!-- Top striker (the part that hits both bells) -->
  <path d="M 246 64 Q 256 56 266 64 L 264 80 L 248 80 Z" fill="#b58863"/>

  <!-- Feet (bottom legs) -->
  <line x1="206" y1="412" x2="190" y2="438" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
  <line x1="306" y1="412" x2="322" y2="438" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
</svg>